<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1518">
<title>AirPods WiFi Bridge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20x='6'%20y='17'%20width='4'%20height='9'%20rx='2'%20fill='%2300bfa5'/%3E%3Crect%20x='14'%20y='9'%20width='4'%20height='17'%20rx='2'%20fill='%2300bfa5'/%3E%3Crect%20x='22'%20y='13'%20width='4'%20height='13'%20rx='2'%20fill='%2300bfa5'/%3E%3C/svg%3E">

<!-- UI kit: @m3e/web 2.9.2 (Material 3 Expressive), vendored under /vendor/.
     Served from the PC itself so the phone needs no internet connection. -->
<link rel="stylesheet" href="./vendor/material-symbols.css">
<script type="module" src="./vendor/m3e.js"></script>

<style>
  /* Fallback until (or unless) the M3E module upgrades the custom elements:
     pure-CSS dark page that stays readable if the bundle fails to load. */
  html { background: #0f1518; }
  body {
    margin: 0;
    min-height: 100%;
    background: #0f1518;
    color: #e3e7e9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* One gutter for everything on the page. */
  :root { --gutter: 16px; --maxw: 30rem; }

  m3e-theme { display: block; min-height: 100dvh; }

  /* Pre-upgrade layout for the few elements that carry the page structure. */
  m3e-card:not(:defined),
  m3e-button-group:not(:defined),
  m3e-linear-progress-indicator:not(:defined) { display: block; }
  m3e-button:not(:defined) {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border: 0; border-radius: 999px;
    background: #7ff0e0; color: #00382f; font: inherit; font-weight: 600;
  }
  m3e-icon:not(:defined) { display: none; }

  main {
    width: 100%;
    max-width: var(--maxw);
    margin-inline: auto;
    box-sizing: border-box;
    /* Top inset clears the notch/status bar now that the app bar is gone. */
    padding: calc(16px + env(safe-area-inset-top)) var(--gutter) calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* -- status hero ------------------------------------------------------- */
  .hero { text-align: center; }
  .hero .content { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hero-icon {
    display: grid; place-items: center;
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--md-sys-color-surface-container-high, #002422);
    color: var(--md-sys-color-on-surface-variant, #89b3af);
  }
  .hero-icon m3e-icon { font-size: 40px; width: 40px; height: 40px; }
  .hero.live .hero-icon {
    background: var(--md-sys-color-primary-container, #a8fbe7);
    color: var(--md-sys-color-on-primary-container, #006254);
  }
  .hero.error .hero-icon {
    background: var(--md-sys-color-error-container, #570a0a);
    color: var(--md-sys-color-on-error-container, #ffdad4);
  }
  .hero-text {
    margin: 0; max-width: 22rem;
    color: var(--md-sys-color-on-surface-variant, #a9b4b7);
    font-size: 0.95rem; line-height: 1.45;
  }
  m3e-linear-progress-indicator { width: min(240px, 70%); }
  .is-hidden { display: none !important; }

  /* -- controls ---------------------------------------------------------- */
  /* Direction toggle: the library's connected button group — one joined pill
     split into Listen / Mic. Each half is a tonal toggle button recolored to
     the app palette: a filled primary-container block when selected, a
     surface block when idle. */
  #mode {
    width: 100%;
    --m3e-tonal-button-unselected-container-color: var(--md-sys-color-surface-container-high);
    --m3e-tonal-button-unselected-label-text-color: var(--md-sys-color-on-surface-variant);
    --m3e-tonal-button-unselected-icon-color: var(--md-sys-color-on-surface-variant);
    --m3e-tonal-button-selected-container-color: var(--md-sys-color-primary-container);
    --m3e-tonal-button-selected-label-text-color: var(--md-sys-color-on-primary-container);
    --m3e-tonal-button-selected-icon-color: var(--md-sys-color-on-primary-container);
  }
  /* Split the width evenly between the two halves. */
  #mode m3e-button { flex: 1 1 0; }

  #action { width: 100%; }
  /* Connected: the button hangs up, so it turns into a solid error block. */
  #action.is-stop {
    --m3e-filled-button-container-color: var(--md-sys-color-error);
    --m3e-filled-button-label-text-color: var(--md-sys-color-on-error);
    --m3e-filled-button-icon-color: var(--md-sys-color-on-error);
  }
  /* Icon size follows the button's own size tokens (extra-large => 40px), so
     it stays in proportion to the label without a hard-coded override. */
  .footnote {
    margin: 0 auto; max-width: 24rem; text-align: center;
    font-size: 0.8rem; line-height: 1.5;
    color: var(--md-sys-color-on-surface-variant, #a9b4b7);
  }

  /* -- diagnostics ------------------------------------------------------- */
  .diag .content { display: flex; flex-direction: column; gap: 10px; }
  m3e-chip-set { flex-wrap: wrap; }
  m3e-chip { font-variant-numeric: tabular-nums; }
</style>
</head>

<body>
<!-- scheme="dark": this page lives on a phone in a dark room next to a PC.
     When m3e-theme is a direct child of <body> it publishes the Material
     tokens on html/body, so the CSS above can read --md-sys-color-*. -->
<m3e-theme color="#00bfa5" variant="expressive" scheme="dark" motion="expressive" strong-focus>
  <main>
    <m3e-card variant="elevated" class="hero" id="hero">
      <div slot="content" class="content">
        <span class="hero-icon"><m3e-icon id="hero-icon" name="headphones"></m3e-icon></span>
        <m3e-heading variant="headline" size="small" id="hero-title">Ready</m3e-heading>
        <p class="hero-text" id="hero-text">Play this PC's audio through your AirPods.</p>
        <m3e-linear-progress-indicator id="busy" indeterminate class="is-hidden"></m3e-linear-progress-indicator>
      </div>
    </m3e-card>

    <m3e-button-group id="mode" variant="connected" size="medium" aria-label="Direction">
      <m3e-button value="listen" variant="tonal" size="medium" toggle selected>
        <m3e-icon slot="icon" name="headphones"></m3e-icon> Listen
      </m3e-button>
      <m3e-button value="mic" variant="tonal" size="medium" toggle>
        <m3e-icon slot="icon" name="mic"></m3e-icon> Mic
      </m3e-button>
    </m3e-button-group>

    <m3e-button id="action" variant="filled" size="extra-large">
      <m3e-icon slot="icon" id="action-icon" name="play_arrow" filled></m3e-icon>
      <span id="action-label">Start</span>
    </m3e-button>

    <p class="footnote" id="footnote">Keep this page open and the screen on while streaming.</p>

    <m3e-card variant="outlined" class="diag is-hidden" id="diag">
      <m3e-heading slot="header" variant="title" size="small">Diagnostics</m3e-heading>
      <div slot="content" class="content">
        <m3e-chip-set id="stats"></m3e-chip-set>
      </div>
    </m3e-card>
  </main>
</m3e-theme>

<!-- playsinline + autoplay: sound still only starts after the user-gesture
     unlock performed inside the Start click handler (iOS Safari policy).
     Used in Listen mode only; Mic mode never plays anything back. -->
<audio id="player" autoplay playsinline></audio>

<script>
"use strict";

const player = document.getElementById("player");
const hero = document.getElementById("hero");
const heroIcon = document.getElementById("hero-icon");
const heroTitle = document.getElementById("hero-title");
const heroText = document.getElementById("hero-text");
const busy = document.getElementById("busy");
const modeGroup = document.getElementById("mode");
const actionBtn = document.getElementById("action");
const actionIcon = document.getElementById("action-icon");
const actionLabel = document.getElementById("action-label");
const diag = document.getElementById("diag");
const statsEl = document.getElementById("stats");

let pc = null;              // live RTCPeerConnection, or null when idle
let micStream = null;
let statsTimer = null;
let prevRtp = null;
let mode = "listen";        // "listen" = PC->AirPods, "mic" = phone mic -> PC

// Mic capture (getUserMedia) needs a secure context: served over https:// or
// localhost. Loaded over plain http://LAN-IP the browser hides the mic API, so
// tell the user to switch to the https URL rather than failing cryptically.
const micSupported = window.isSecureContext &&
  !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

// --- view ---------------------------------------------------------------- //
// The direction control is a connected button group of two toggle buttons.
// Its `selected`/`disabled` properties are read and written directly; toggling
// happens on click and the group keeps the two buttons mutually exclusive.
function modeButtons() { return [...modeGroup.querySelectorAll("m3e-button")]; }

function selectedMode() {
  const btn = modeButtons().find((b) => b.selected);
  return btn ? btn.getAttribute("value") : null;
}

function applyMode(next) {
  mode = next;
  for (const btn of modeButtons()) {
    btn.selected = btn.getAttribute("value") === mode;
  }
}

// state: "idle" | "busy" | "live" | "error"
function render(state, title, text) {
  hero.classList.remove("live", "error");
  if (state === "live") hero.classList.add("live");
  if (state === "error") hero.classList.add("error");

  heroIcon.name = state === "error" ? "error"
    : mode === "mic" ? "mic"
    : "headphones";
  heroTitle.textContent = title;
  heroText.textContent = text;
  busy.classList.toggle("is-hidden", state !== "busy");

  const live = state === "live";
  actionIcon.name = live ? "stop" : "play_arrow";
  actionLabel.textContent = live ? "Stop" : state === "busy" ? "Connecting…" : "Start";
  actionBtn.classList.toggle("is-stop", live);
  actionBtn.disabled = state === "busy";
  const locked = state === "busy" || state === "live";
  for (const btn of modeButtons()) btn.toggleAttribute("disabled", locked);
  diag.classList.toggle("is-hidden", !live);
}

function idle() {
  render("idle", "Ready", mode === "mic"
    ? (micSupported
        ? "Use your iPhone's microphone as a PC input."
        : "Mic needs the https:// address — reopen this page there.")
    : "Play this PC's audio through your AirPods.");
}

function toast(message) {
  if (typeof M3eSnackbar === "object" && M3eSnackbar) M3eSnackbar.open(message, true);
}

// --- live diagnostics ----------------------------------------------------- //
// Listen mode reads the receive jitter buffer (the browser's share of total
// delay); mic mode reads the outbound packet rate so you can see the mic is
// actually sending (~50 pkt/s at 20 ms ptime).
function setStats(entries) {
  statsEl.textContent = "";
  for (const [icon, label] of entries) {
    const chip = document.createElement("m3e-chip");
    chip.setAttribute("variant", "elevated");
    const glyph = document.createElement("m3e-icon");
    glyph.setAttribute("slot", "icon");
    glyph.setAttribute("name", icon);
    chip.append(glyph, document.createTextNode(label));
    statsEl.append(chip);
  }
}

function startStats() {
  stopStats();
  statsTimer = setInterval(async () => {
    if (!pc || pc.connectionState !== "connected") return;
    const report = await pc.getStats();
    const wantType = mode === "listen" ? "inbound-rtp" : "outbound-rtp";
    report.forEach((entry) => {
      if (entry.type !== wantType || entry.kind !== "audio") return;
      if (mode === "listen" && prevRtp && entry.jitterBufferDelay !== undefined) {
        const delay = entry.jitterBufferDelay - prevRtp.jitterBufferDelay;
        const count = entry.jitterBufferEmittedCount - prevRtp.jitterBufferEmittedCount;
        const lost = Math.max(0, (entry.packetsLost || 0) - (prevRtp.packetsLost || 0));
        if (count > 0) {
          setStats([
            ["timer", Math.round((delay / count) * 1000) + " ms buffer"],
            ["wifi_off", lost + " pkt lost/s"],
          ]);
        }
      } else if (mode === "mic" && prevRtp && entry.packetsSent !== undefined) {
        setStats([["send", (entry.packetsSent - prevRtp.packetsSent) + " pkt/s"]]);
      }
      prevRtp = entry;
    });
  }, 1000);
}

function stopStats() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  prevRtp = null;
  statsEl.textContent = "";
}

// --- WebRTC -------------------------------------------------------------- //
// The server expects a complete (non-trickle) offer in a single POST, so wait
// until ICE gathering finishes. LAN host candidates gather near-instantly.
function waitForIceGathering(conn) {
  if (conn.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const check = () => {
      if (conn.iceGatheringState === "complete") {
        conn.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    conn.addEventListener("icegatheringstatechange", check);
  });
}

function teardown() {
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (pc) { pc.close(); pc = null; }
  stopStats();
}

async function connect() {
  render("busy", "Connecting…", "Negotiating with the PC over your LAN.");

  // Same-LAN only: host candidates are enough, no STUN/TURN servers needed.
  pc = new RTCPeerConnection({ iceServers: [] });
  const endpoint = mode === "mic" ? "/mic-offer" : "/offer";

  try {
    if (mode === "listen") {
      const transceiver = pc.addTransceiver("audio", { direction: "recvonly" });
      // LATENCY KNOB: ask for the minimum receive jitter buffer (0 = as low as
      // the browser dares; it keeps an internal floor and adapts up on bad WiFi).
      const receiver = transceiver.receiver;
      try { if ("playoutDelayHint" in receiver) receiver.playoutDelayHint = 0; } catch (e) {}
      try { if ("jitterBufferTarget" in receiver) receiver.jitterBufferTarget = 0; } catch (e) {}

      pc.addEventListener("track", (evt) => {
        player.srcObject = evt.streams[0];
        player.play().catch(() => toast("Audio blocked — tap Start again"));
      });
    } else {
      if (!micSupported) throw new Error("mic needs the https:// address");
      // Raw-ish mic: leave echo cancellation off (not a call), keep noise
      // suppression + auto gain so it's usable as a general PC microphone.
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true },
      });
      for (const track of micStream.getAudioTracks()) {
        pc.addTransceiver(track, { direction: "sendonly" });
      }
    }
  } catch (err) {
    teardown();
    return fail(err);
  }

  pc.addEventListener("connectionstatechange", () => {
    if (pc.connectionState === "connected") {
      render("live", mode === "mic" ? "Mic live" : "Streaming",
        mode === "mic"
          ? "Your phone's microphone is now an input on the PC."
          : "PC audio is playing through this phone.");
      startStats();
    } else if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
      teardown();
      render("error", "Disconnected", "Tap Start to reconnect.");
    } else {
      render("busy", "Connecting…", "Connection: " + pc.connectionState);
    }
  });

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await waitForIceGathering(pc);
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
    if (!response.ok) throw new Error("signaling failed (HTTP " + response.status + ")");
    await pc.setRemoteDescription(await response.json());
  } catch (err) {
    teardown();
    return fail(err);
  }

  // Best effort: keep the screen awake. iOS suspends Safari (and this session)
  // when the phone locks or the tab goes to background.
  try { await navigator.wakeLock.request("screen"); } catch (e) {}
}

function fail(err) {
  render("error", "Could not connect", err.message);
  toast(err.message);
}

// --- events -------------------------------------------------------------- //
modeGroup.addEventListener("change", () => {
  if (pc) { applyMode(mode); return; }        // don't switch mid-session
  const next = selectedMode();
  if (!next) { applyMode(mode); return; }     // ignore tapping the active half
  mode = next;
  idle();
});

actionBtn.addEventListener("click", () => {
  if (pc) {                 // connected -> hang up
    teardown();
    idle();
    return;
  }
  // Unlock audio while still inside the click gesture: iOS Safari only honors
  // .play() calls traceable to a user interaction. Playing the (empty) element
  // now grants playback for the stream arriving later.
  if (mode === "listen") player.play().catch(() => {});
  connect();
});

idle();
</script>
</body>
</html>
